<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>

  <div id="myDIV" class="header">
    <input type="text" id="myInput" placeholder="Add a new task...">
    <span class="addBtn" onclick="newElement()">Add</span>
  </div>

  <ul id="myUL">
    <li>🚀 Start the day with a smile</li>
    <li class="checked">💧 Drink 8 glasses of water</li>
    <li>📚 Learn something new today</li>
    <li>🏃 Do 20 minutes of exercise</li>
    <li>🖊️ Write down 3 things you’re grateful for</li>
    <li>🌱 Take a 5-minute nature break</li>
  </ul>

  <!-- <script src="index.js"></script> -->
</body>
</html>
